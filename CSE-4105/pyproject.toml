readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy<2",
    "pandas>=2.2",
    "matplotlib>=3.9",
]

[dependency-groups]
dev = [
    "jupyterlab>=4.2",
    "nbconvert>=7.16",
    "ipykernel>=6.29",
    "nbclient>=0.10",
    "black>=26.10.1",
]
